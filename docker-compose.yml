services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env   # reuse your existing .env (AZURE_PROJECT_ENDPOINT, AI_SEARCH_*, AGENT_NAME)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
